# MinIO, the upstream the end-to-end test seals onto, built from source:
# MinIO no longer publishes images or binaries, and its repository is
# archived. Cached by release, so it is built once.
name: minio
description: a MinIO binary at minio/minio, built from a release's source
inputs:
  release:
    description: the release tag
    required: true
runs:
  using: composite
  steps:
    - name: minio (cached by release)
      id: cache
      uses: actions/cache@v4
      with:
        path: minio/minio
        key: minio-${{ runner.os }}-${{ inputs.release }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
      run: |
        git clone -q --depth 1 --branch "$RELEASE" \
          https://github.com/minio/minio minio-src
        mkdir -p minio
        (cd minio-src && CGO_ENABLED=0 go build -trimpath -o ../minio/minio .)
        rm -rf minio-src
